# Cloudflare Workers Configuration for Nepal Distributors API
name = "damali-group-official"
main = "server/src/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

# Public environment variables
[vars]
ENVIRONMENT = "production"
COMPANY_RECEIVER_EMAIL = "abiseksbd@gmail.com"
EMAIL_FROM = "Nepal Distributors <inquiries@resend.dev>"

# Cloudflare D1 Database Binding for B2B Inquiries
# Run `npx wrangler d1 create nepal-distributors-db` to provision your D1 database.
# Paste the resulting database_id below:
[[d1_databases]]
binding = "nepal_distributors_db"
database_name = "nepal-distributors-db"
database_id = "16927335-d0d1-4e5f-9a02-3ab333694634"

# Cloudflare KV Namespace for Distributed Rate Limiting (Optional but recommended)
# Run `npx wrangler kv:namespace create RATE_LIMIT_KV`
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "placeholder-kv-namespace-id"

# Note on Secrets:
# Set your Resend API Key or SendGrid Key securely via Wrangler CLI:
#   npx wrangler secret put RESEND_API_KEY
# Or via Cloudflare Dashboard: Workers & Pages -> Your Worker -> Settings -> Variables -> Secrets.


